name: BATS testsuite

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  docker-bats:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build CI container
        run: |
          docker build \
            -f .github/docker/tulio-ci.Dockerfile \
            -t tulio-ci:${{ github.sha }} \
            .

      - name: Start CI container
        run: |
          docker run -d \
            --name tulio-ci \
            --hostname tulio-dev.local \
            --privileged \
            --cgroupns=host \
            --tmpfs /run \
            --tmpfs /run/lock \
            --tmpfs /tmp:exec,mode=1777 \
            --dns 8.8.8.8 \
            --dns 8.8.4.4 \
            --dns 2001:4860:4860::8888 \
            --dns 2001:4860:4860::8844 \
            -e TZ=UTC \
            -e LANG=en_US.UTF-8 \
            -e LC_ALL=en_US.UTF-8 \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "${GITHUB_WORKSPACE}:/tuliocp-git" \
            -w /tuliocp-git \
            tulio-ci:${{ github.sha }}
          for _ in {1..100}; do
            docker exec tulio-ci bash -lc 'systemctl is-system-running 2>/dev/null | grep -Eq "running|degraded"' && break
            sleep 0.1
          done

      - name: Install Tulio from local git
        run: |
          docker exec tulio-ci bash -lc '
            set -euxo pipefail
            export TERM=xterm
            cd /tuliocp-git/src
            bash ./hst_autocompile.sh --tulio --noinstall --keepbuild "~localsrc"
            DEB_PATH=""
            if [[ -f "/tmp/tuliocp-src/deb" ]]; then
              pkg="$(dpkg-deb -f /tmp/tuliocp-src/deb Package)"
              ver="$(dpkg-deb -f /tmp/tuliocp-src/deb Version)"
              arch="$(dpkg-deb -f /tmp/tuliocp-src/deb Architecture)"
              DEB_PATH="/tmp/tuliocp-src/debs"
              mkdir -p "${DEB_PATH}"
              cp /tmp/tuliocp-src/deb "${DEB_PATH}/${pkg}_${ver}_${arch}.deb"
            fi
            if compgen -G "/tmp/tuliocp-src/deb/tulio_*.deb" >/dev/null; then
              DEB_PATH="/tmp/tuliocp-src/deb"
            elif compgen -G "/tmp/tuliocp-src/debs/tulio_*.deb" >/dev/null; then
              DEB_PATH="/tmp/tuliocp-src/debs"
            else
              echo "No local tulio debs found under /tmp/tuliocp-src/{deb,debs}"
              ls -la /tmp/tuliocp-src || true
              ls -la /tmp/tuliocp-src/deb || true
              ls -la /tmp/tuliocp-src/debs || true
              exit 1
            fi
            cd /tuliocp-git
            bash install/tulio-install-ubuntu.sh \
              --hostname tulio.local.test \
              --email admin@example.com \
              --username admin \
              --password Password123 \
              --interactive no \
              --force \
              --with-debs "${DEB_PATH}" \
              --clamav no \
              --spamassassin no
          '

      - name: Run BATS test suite
        run: |
          docker exec tulio-ci bash -lc '
            set -euxo pipefail
            cd /tuliocp-git
            if ! command -v bats >/dev/null 2>&1; then
              test/test_helper/bats-core/install.sh /usr/local
            fi
            bats test/test.bats
          '

      - name: Collect logs on failure
        if: failure()
        run: |
          docker exec tulio-ci bash -lc 'journalctl --no-pager -n 500' || true
          docker exec tulio-ci bash -lc 'ls -la /root/hst_install_backups || true' || true
          docker exec tulio-ci bash -lc 'tail -n 500 /root/hst_install_backups/hst_install-*.log || true' || true

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f tulio-ci || true
